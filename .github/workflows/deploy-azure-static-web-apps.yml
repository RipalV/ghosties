name: Deploy Ghosties to Azure Static Web Apps

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  # Queue reruns instead of cancelling mid-Terraform; cancelled plans leave Azure state locks.
  group: azure-static-web-apps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  TF_WORKING_DIR: terraform
  SWA_RESOURCE_GROUP: rg-ghosties-prod
  SWA_NAME: swa-ghosties-prod

jobs:
  terraform:
    if: |
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    name: Terraform
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-uks-foundation" \
            -backend-config="storage_account_name=stripalterraformproduks" \
            -backend-config="container_name=tfstate-ghosties" \
            -backend-config="key=ghosties.tfstate"

      - name: Release stale Terraform state lock
        run: bash scripts/release-stale-lock.sh
        env:
          STALE_MINUTES: 15

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false -no-color -lock-timeout=10m

      # Production infrastructure changes only from main (never from PRs or other branches).
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: terraform apply -auto-approve -input=false -no-color -lock-timeout=10m

  build_and_deploy_production:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Build and Deploy Production
    needs: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build
        run: npm run build

      # Fetch the token in this job. Masked values cannot be passed via job outputs.
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Capture deployment token from Azure
        id: token
        run: |
          TOKEN="$(az staticwebapp secrets list \
            --name "${SWA_NAME}" \
            --resource-group "${SWA_RESOURCE_GROUP}" \
            --query "properties.apiKey" \
            -o tsv | tr -d '\r\n')"
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not read Static Web App API key for ${SWA_NAME} in ${SWA_RESOURCE_GROUP}."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          {
            echo "deployment_token<<EOF"
            echo "$TOKEN"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web Apps (production)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.deployment_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Upload the existing Vite dist output; do not rebuild inside the Azure action.
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true

  build_and_deploy_preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Preview
    needs: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build
        run: npm run build

      # Fetch the token in this job. Masked values cannot be passed via job outputs.
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Capture deployment token from Azure
        id: token
        run: |
          TOKEN="$(az staticwebapp secrets list \
            --name "${SWA_NAME}" \
            --resource-group "${SWA_RESOURCE_GROUP}" \
            --query "properties.apiKey" \
            -o tsv | tr -d '\r\n')"
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not read Static Web App API key for ${SWA_NAME} in ${SWA_RESOURCE_GROUP}."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          {
            echo "deployment_token<<EOF"
            echo "$TOKEN"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web Apps (PR preview)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.deployment_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Preview
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Capture deployment token from Azure
        id: token
        run: |
          TOKEN="$(az staticwebapp secrets list \
            --name "${SWA_NAME}" \
            --resource-group "${SWA_RESOURCE_GROUP}" \
            --query "properties.apiKey" \
            -o tsv | tr -d '\r\n')"
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not read Static Web App API key for ${SWA_NAME} in ${SWA_RESOURCE_GROUP}."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          {
            echo "deployment_token<<EOF"
            echo "$TOKEN"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Close Azure Static Web Apps preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.deployment_token }}
          action: close
