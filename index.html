<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#17142b" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317142b'/%3E%3Cpath d='M16 5a9 9 0 0 0-9 9v13l3.6-3 3.6 3 3.6-3 3.6 3V14a9 9 0 0 0-9-9z' fill='%23e9e6ff'/%3E%3Ccircle cx='12.6' cy='14.5' r='1.7' fill='%2317142b'/%3E%3Ccircle cx='19.4' cy='14.5' r='1.7' fill='%2317142b'/%3E%3C/svg%3E"
    />
    <meta name="description" content="Project Ghosties — a playful ghost haunting game prototype." />
    <title>Project Ghosties</title>
  </head>
  <body>
    <main id="app" aria-label="Project Ghosties game"></main>
    <button id="fullscreen-toggle" type="button" aria-label="Play in full screen">⛶</button>
    <div
      id="rotate-prompt"
      role="dialog"
      aria-modal="true"
      aria-labelledby="rotate-title"
      aria-describedby="rotate-copy"
      data-visible="false"
      hidden
    >
      <div class="card">
        <h1 id="rotate-title">Rotate to play</h1>
        <p id="rotate-copy">
          Ghosties works best in landscape. Turn your device sideways, then haunt the hotel lobby!
        </p>
        <p class="hint" aria-hidden="true">📱 → 🖥️</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
